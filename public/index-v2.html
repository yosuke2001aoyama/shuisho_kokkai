<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国会答弁・質問主意書アーカイブ</title><style>:root{--navy:#14233d;--red:#b93643;--line:#d8dee7;--muted:#687386;--bg:#f3f5f8;--mark:#fff1a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.top{background:var(--navy);color:#fff;padding:18px 6vw;display:flex;justify-content:space-between;gap:20px}.top h1{margin:0;font-family:"Yu Mincho",serif;font-size:25px}.top p{margin:5px 0 0;color:#cbd5e1;font-size:12px}.tabs{display:flex;gap:7px}.tabs button{border:1px solid #ffffff44;background:#ffffff0c;color:#fff;padding:10px 15px;font-weight:700}.tabs button.on{background:#fff;color:var(--navy)}main{max-width:1220px;margin:28px auto 60px;padding:0 22px}.panel{background:#fff;border:1px solid var(--line);padding:26px;margin-bottom:20px}.hidden{display:none}.grid{display:grid;grid-template-columns:minmax(320px,.78fr) minmax(0,1.22fr);gap:20px}.field{display:grid;gap:7px;margin-bottom:14px}input,textarea,select{width:100%;border:1px solid #cbd5e1;padding:14px;font:inherit}.primary{width:100%;min-height:49px;border:0;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.output{font-family:"Yu Mincho",serif;line-height:2.05;font-size:17px;min-height:320px}.segment{white-space:pre-wrap}.source-link{background:var(--mark);border-bottom:1px dotted #8a6c00;color:inherit;text-decoration:none;cursor:pointer;padding:1px 2px}.source-link:hover{background:#ffe873}.refs{border-top:1px solid var(--line);margin-top:24px;padding-top:18px}.card{border:1px solid var(--line);padding:16px;margin:11px 0;background:#fff;scroll-margin-top:18px}.card.flash{outline:3px solid #f0c84b}.card h4{margin:0 0 7px;font-family:"Yu Mincho",serif}.meta,.usage{font-size:12px;color:var(--muted)}.phrase{font-family:"Yu Mincho",serif;background:#f8fafc;border-left:3px solid var(--navy);padding:11px 13px;margin:10px 0;line-height:1.75}.card a{font-size:12px;color:#1d4f91;font-weight:700}.disclaimer{margin-top:24px;padding-top:11px;border-top:1px solid var(--line);font-size:10px;line-height:1.6;color:#7b8494;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.row{display:grid;grid-template-columns:1fr auto;gap:9px}.row button{border:0;background:var(--red);color:white;font-weight:800;padding:0 24px}.results{display:grid;gap:10px;margin-top:16px}.status{margin-top:14px;padding:11px;background:#f7f4ea;font-size:12px}@media(max-width:850px){.top{flex-direction:column}.grid,.row{grid-template-columns:1fr}.tabs button{flex:1}.output{font-size:16px}}</style></head><body><header class="top"><div><h1>国会答弁・質問主意書アーカイブ</h1><p>公開一次資料の横断検索・答弁原案の作成</p></div><div class="tabs"><button id="tabSearch" class="on">公開検索</button><button id="tabDraft">答弁原案を作る</button></div></header><main><section id="searchView" class="panel"><h2>一次資料を検索</h2><div class="row"><input id="q" placeholder="例：拉致被害者、物価高、安全保障"><button id="searchBtn">検索</button></div><div id="searchStatus" class="status">検索語を入力してください。</div><div id="results" class="results"></div></section><section id="draftView" class="hidden"><div class="grid"><div class="panel"><h2>質問案を入力</h2><div class="field"><label>形式</label><select id="mode"><option value="speech">国会答弁</option><option value="written">質問主意書答弁書</option></select></div><div class="field"><label>質問案</label><textarea id="question" rows="16"></textarea></div><button id="draftBtn" class="primary">答弁原案を作成</button></div><div class="panel"><h2 id="draftTitle">答弁原案</h2><div id="draftOutput" class="output">左側に質問案を入力してください。</div><div id="references" class="refs"></div><div id="disclaimer" class="disclaimer hidden"></div></div></div></section></main><script>const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function show(d){$('#draftView').classList.toggle('hidden',!d);$('#searchView').classList.toggle('hidden',d);$('#tabDraft').classList.toggle('on',d);$('#tabSearch').classList.toggle('on',!d)}$('#tabSearch').onclick=()=>show(false);$('#tabDraft').onclick=()=>show(true);function card(x,id=''){return `<article class="card" ${id?`id="${id}"`:''}><h4>${esc(x.title||'参考資料')}</h4><div class="meta">${esc(x.date||'')} ${esc(x.speaker||'')}｜${esc(x.sourceName||'')}</div>${x.quotedPhrase?`<div class="phrase">${esc(x.quotedPhrase)}</div>`:''}${x.usage?`<div class="usage">使い方：${esc(x.usage)}</div>`:''}<p><a href="${esc(x.url||'#')}" target="_blank" rel="noopener">公式原文を開く ↗</a></p></article>`}function renderDraft(d){const refs=d.references||[],available=new Set(refs.map(x=>x.sourceId));$('#draftTitle').textContent=d.title;$('#draftOutput').innerHTML=(d.segments||[{text:d.draft}]).map(s=>{const body=esc(s.text);return s.sourceId&&available.has(s.sourceId)?`<a class="segment source-link" href="#ref-${esc(s.sourceId)}" data-ref="${esc(s.sourceId)}">${body}</a>`:`<span class="segment">${body}</span>`}).join('');$('#references').innerHTML=refs.length?`<h3>${esc(d.referenceLabel||'根拠')}</h3>`+refs.map(x=>card(x,'ref-'+x.sourceId)).join(''):'<h3>根拠</h3><div class="status">対応する一次資料を表示できませんでした。</div>';$('#disclaimer').textContent=d.disclaimer||'';$('#disclaimer').classList.toggle('hidden',!d.disclaimer);document.querySelectorAll('.source-link').forEach(a=>a.onclick=e=>{e.preventDefault();const el=$('#ref-'+CSS.escape(a.dataset.ref));if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}})}$('#draftBtn').onclick=async()=>{const question=$('#question').value.trim();if(question.length<8)return alert('質問案を8文字以上で入力してください。');$('#draftBtn').disabled=true;$('#draftOutput').textContent='作成中…';try{const r=await fetch('/api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:$('#mode').value,question})}),d=await r.json();if(!r.ok)throw new Error(d.error);renderDraft(d)}catch(e){$('#draftOutput').textContent='原案の作成に失敗しました。\n'+e.message}finally{$('#draftBtn').disabled=false}};$('#searchBtn').onclick=async()=>{const q=$('#q').value.trim();if(!q)return;$('#searchStatus').textContent='検索中…';const r=await fetch('/api/search?q='+encodeURIComponent(q)+'&type=all'),d=await r.json();$('#searchStatus').textContent=r.ok?`${d.results.length}件。${d.coverage?.note||''}`:d.error;$('#results').innerHTML=(d.results||[]).map(x=>card(x)).join('')};</script></body></html>
