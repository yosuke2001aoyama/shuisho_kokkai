<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国会答弁・質問主意書アーカイブ</title><style>:root{--navy:#14233d;--red:#b93643;--line:#d8dee7;--muted:#687386;--bg:#f3f5f8;--mark:#fff1a8;--borrow:#dcecff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.top{background:var(--navy);color:#fff;padding:18px 6vw;display:flex;justify-content:space-between;gap:20px}.top h1{margin:0;font-family:"Yu Mincho",serif;font-size:25px}.top p{margin:5px 0 0;color:#cbd5e1;font-size:12px}.tabs{display:flex;gap:7px}.tabs button{border:1px solid #ffffff44;background:#ffffff0c;color:#fff;padding:10px 15px;font-weight:700}.tabs button.on{background:#fff;color:var(--navy)}main{max-width:1220px;margin:28px auto 60px;padding:0 22px}.panel{background:#fff;border:1px solid var(--line);padding:26px;margin-bottom:20px}.hidden{display:none}.grid{display:grid;grid-template-columns:minmax(320px,.78fr) minmax(0,1.22fr);gap:20px}.field{display:grid;gap:7px;margin-bottom:14px}.field small{color:var(--muted);line-height:1.5}input,textarea,select{width:100%;border:1px solid #cbd5e1;padding:14px;font:inherit}.primary{width:100%;min-height:49px;border:0;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.output{font-family:"Yu Mincho",serif;line-height:2.05;font-size:17px;min-height:300px}.segment{white-space:pre-wrap}.source-link{background:var(--mark);border-bottom:1px dotted #8a6c00;color:inherit;text-decoration:none;cursor:pointer;padding:1px 2px}.source-link.borrowed{background:repeating-linear-gradient(135deg,var(--borrow),var(--borrow) 8px,#eef6ff 8px,#eef6ff 16px);border-bottom-color:#37699d}.refs{border-top:2px solid var(--navy);margin-top:28px;padding-top:18px}.refs-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.evidence-count{font-size:12px;font-weight:700;color:#315f8b;background:#edf5ff;border:1px solid #bed4eb;padding:5px 8px}.legend{font-size:11px;color:var(--muted);margin:4px 0 14px}.swatch{display:inline-block;width:15px;height:10px;margin:0 4px 0 10px;vertical-align:middle;background:var(--mark);border:1px solid #cbb75b}.swatch.borrow{background:var(--borrow);border-color:#7ea6d0}.card{border:1px solid var(--line);padding:16px;margin:11px 0;background:#fff;scroll-margin-top:18px}.card.flash{outline:3px solid #f0c84b}.card h4{margin:0 0 7px;font-family:"Yu Mincho",serif}.meta,.usage,.badge{font-size:12px;color:var(--muted)}.badge{display:inline-block;margin:0 0 8px;padding:3px 7px;border:1px solid var(--line);background:#f8fafc}.badge.borrowed{background:#eef6ff;color:#315f8b}.phrase{font-family:"Yu Mincho",serif;background:#f8fafc;border-left:3px solid var(--navy);padding:11px 13px;margin:10px 0;line-height:1.75}.card a{font-size:12px;color:#1d4f91;font-weight:700}.disclaimer-box{margin:0 0 20px;padding:13px 16px;border:1px solid #d7c9ae;border-left:5px solid #9b7c43;background:#fffaf0;color:#665b48;font-size:11px;line-height:1.7;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.disclaimer-box strong{display:block;color:#4f4433;margin-bottom:3px}.row{display:grid;grid-template-columns:1fr auto;gap:9px}.row button{border:0;background:var(--red);color:white;font-weight:800;padding:0 24px}.results{display:grid;gap:10px;margin-top:16px}.status{margin-top:14px;padding:11px;background:#f7f4ea;font-size:12px}.error{background:#fff0f0;border-left:4px solid #b93643;color:#7b2730}@media(max-width:850px){.top{flex-direction:column}.grid,.row{grid-template-columns:1fr}.tabs button{flex:1}.output{font-size:16px}}</style></head><body><header class="top"><div><h1>国会答弁・質問主意書アーカイブ</h1><p>公開一次資料の横断検索・答弁原案の作成</p></div><div class="tabs"><button id="tabSearch" class="on">公開検索</button><button id="tabDraft">答弁原案を作る</button></div></header><main><section id="searchView" class="panel"><h2>一次資料を検索</h2><div class="row"><input id="q" placeholder="例：尖閣諸島と日米安保条約5条"><button id="searchBtn">検索</button></div><div id="searchStatus" class="status">検索語を入力してください。</div><div id="results" class="results"></div></section><section id="draftView" class="hidden"><div class="grid"><div class="panel"><h2>質問案を入力</h2><div class="field"><label>形式</label><select id="mode"><option value="speech">国会答弁</option><option value="written">質問主意書答弁書</option></select></div><div class="field" id="respondentField"><label>答弁者カテゴリー</label><select id="respondent"><option value="prime">総理</option><option value="minister" selected>大臣</option><option value="official">政府参考人</option></select><small>総理は大局的方針、大臣は所管政策、政府参考人は法令・制度・運用の詳細を中心に起案する。</small></div><div class="field"><label>質問案</label><textarea id="question" rows="16"></textarea></div><button id="draftBtn" class="primary">答弁原案を作成</button></div><div class="panel"><h2 id="draftTitle">答弁原案</h2><div id="draftOutput" class="output">左側に質問案を入力してください。</div><div id="references" class="refs hidden"></div></div></div><aside id="disclaimer" class="disclaimer-box hidden"><strong>注意：以下は答弁本文ではありません</strong><span id="disclaimerText"></span></aside></section></main><script>const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function show(d){$('#draftView').classList.toggle('hidden',!d);$('#searchView').classList.toggle('hidden',d);$('#tabDraft').classList.toggle('on',d);$('#tabSearch').classList.toggle('on',!d)}$('#tabSearch').onclick=()=>show(false);$('#tabDraft').onclick=()=>show(true);$('#mode').onchange=()=>$('#respondentField').classList.toggle('hidden',$('#mode').value==='written');function card(x,id=''){const cat=x.categoryLabel?`<span class="badge ${x.borrowed?'borrowed':''}">${esc(x.categoryLabel)}${x.borrowed?'（別カテゴリーから参照）':''}</span>`:'';return `<article class="card" ${id?`id="${id}"`:''}>${cat}<h4>${esc(x.title||'参考資料')}</h4><div class="meta">${esc(x.date||'')} ${esc(x.speaker||'')} ${esc(x.speakerPosition||'')}｜${esc(x.sourceName||'')}</div>${x.quotedPhrase?`<div class="phrase">${esc(x.quotedPhrase)}</div>`:''}${x.usage?`<div class="usage">参照理由：${esc(x.usage)}</div>`:''}<p><a href="${esc(x.url||'#')}" target="_blank" rel="noopener">公式原文を開く ↗</a></p></article>`}function renderDraft(d){const refs=d.references||[],keys=new Set(refs.map(x=>x.referenceKey));$('#draftTitle').textContent=d.title;$('#draftOutput').innerHTML=(d.segments||[{text:d.draft}]).map(s=>{const body=esc(s.text);return s.referenceKey&&keys.has(s.referenceKey)?`<a class="segment source-link ${s.borrowed?'borrowed':''}" href="#ref-${s.referenceKey}" data-ref="${s.referenceKey}">${body}</a>`:`<span class="segment">${body}</span>`}).join('');$('#references').classList.remove('hidden');$('#references').innerHTML=refs.length?`<div class="refs-head"><h3>${esc(d.referenceLabel||'根拠')}</h3><span class="evidence-count">一次資料 ${refs.length}件</span></div><div class="legend"><span class="swatch"></span>直接参照 <span class="swatch borrow"></span>別カテゴリーから参照</div>`+refs.map(x=>card(x,'ref-'+x.referenceKey)).join(''):'<div class="refs-head"><h3>根拠</h3><span class="evidence-count">0件</span></div><div class="status error">一次資料を取得できていないため、この原案は使用しないこと。</div>';$('#disclaimerText').textContent=d.disclaimer||'';$('#disclaimer').classList.toggle('hidden',!d.disclaimer);document.querySelectorAll('.source-link').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById('ref-'+a.dataset.ref);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}})}$('#draftBtn').onclick=async()=>{const question=$('#question').value.trim();if(question.length<8)return alert('質問案を8文字以上で入力してください。');$('#draftBtn').disabled=true;$('#draftOutput').textContent='同一論点の政府公式見解と過去答弁を検索中…';$('#references').classList.add('hidden');$('#disclaimer').classList.add('hidden');try{const r=await fetch('/api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:$('#mode').value,respondent:$('#respondent').value,question})}),d=await r.json();if(!r.ok)throw new Error(d.error);renderDraft(d)}catch(e){$('#draftOutput').innerHTML=`<div class="status error">原案の作成に失敗した。${esc(e.message)}</div>`}finally{$('#draftBtn').disabled=false}};$('#searchBtn').onclick=async()=>{const q=$('#q').value.trim();if(!q)return;$('#searchStatus').textContent='検索中…';const r=await fetch('/api/search?q='+encodeURIComponent(q)+'&respondent='+encodeURIComponent($('#respondent').value)),d=await r.json();$('#searchStatus').textContent=r.ok?`${d.results.length}件。${d.coverage?.note||''}`:d.error;$('#results').innerHTML=(d.results||[]).map(x=>card({...x,quotedPhrase:x.excerpt,categoryLabel:({prime:'総理',minister:'大臣',official:'政府参考人',cabinet:'政府・閣議決定資料'}[x.category]||x.category)})).join('')};</script></body></html>
