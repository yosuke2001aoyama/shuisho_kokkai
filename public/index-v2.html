<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国会答弁・質問主意書アーカイブ</title><style>:root{--navy:#14233d;--navy2:#1d3153;--red:#b93643;--line:#d8dee7;--muted:#687386;--bg:#f3f5f8;--gold:#aa8743}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.top{background:var(--navy);color:#fff;padding:18px max(24px,6vw);display:flex;align-items:center;justify-content:space-between;gap:20px}.brand h1{margin:0;font-family:"Yu Mincho",serif;font-size:25px}.brand p{margin:5px 0 0;color:#cbd5e1;font-size:12px}.tabs{display:flex;gap:6px}.tabs button{border:1px solid #ffffff44;background:#ffffff0c;color:#fff;padding:10px 15px;font-weight:700;border-radius:3px}.tabs button.active{background:#fff;color:var(--navy)}main{max-width:1220px;margin:28px auto 70px;padding:0 22px}.panel{background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px #12213d0d;padding:26px;margin-bottom:22px;border-radius:4px}.panel h2,.panel h3{margin:0 0 18px;font-family:"Yu Mincho",serif}.lead{color:var(--muted);font-size:13px;margin:-8px 0 20px;line-height:1.7}.row{display:grid;grid-template-columns:1fr auto;gap:10px}.row input,textarea,select{width:100%;border:1px solid #cbd5e1;padding:14px;font:inherit;background:#fff;border-radius:3px}.row button,.primary,.ghost{border:0;background:var(--red);color:#fff;padding:0 24px;font-weight:800;border-radius:3px;cursor:pointer}.switch{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.switch button{border:1px solid var(--line);background:#f8fafc;padding:9px 14px;border-radius:3px;cursor:pointer}.switch button.active{background:var(--navy);color:#fff}.status{margin-top:17px;padding:12px 14px;background:#f8f6ef;border-left:3px solid var(--gold);color:#645f52;font-size:13px}.results{display:grid;gap:12px;margin-top:18px}.card{border:1px solid var(--line);padding:17px;background:#fff;border-radius:3px}.card h4{margin:0 0 6px;font-family:"Yu Mincho",serif;line-height:1.55}.meta{color:var(--muted);font-size:11px;margin-bottom:8px}.card p{color:#4b5563;line-height:1.75;font-size:13px;white-space:pre-wrap}.card a{color:#1d4f91;font-weight:700;font-size:12px}.draft-grid{display:grid;grid-template-columns:minmax(320px,.78fr) minmax(0,1.22fr);gap:20px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:12px;font-weight:800}.primary{min-height:49px;width:100%}.primary:disabled{opacity:.6}.output-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.ghost{background:#eef2f7;color:var(--navy);padding:9px 13px;border:1px solid var(--line)}.output{white-space:pre-wrap;font-family:"Yu Mincho",serif;line-height:2.05;min-height:330px;font-size:16px}.refs{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}.phrase{font-family:"Yu Mincho",serif;background:#f8fafc;border-left:3px solid var(--navy2);padding:11px 13px;margin:10px 0;line-height:1.8}.usage{font-size:12px;color:#5c6677}.hidden{display:none}.notice{background:#fff7f1;border-left:3px solid #c66b3a;padding:11px 12px;font-size:12px;color:#6e5244;margin-bottom:15px}.footer-note{max-width:1180px;margin:0 auto 28px;padding:0 22px;color:#7a8493;font-size:11px;line-height:1.7}.loading{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.45}}@media(max-width:850px){.top{align-items:flex-start;flex-direction:column}.draft-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.row button{min-height:48px}.tabs{width:100%}.tabs button{flex:1}.panel{padding:20px}.output{font-size:15px}}</style></head><body><header class="top"><div class="brand"><h1>国会答弁・質問主意書アーカイブ</h1><p>公開一次資料の横断検索・答弁原案の作成</p></div><div class="tabs"><button id="tabSearch" class="active">公開検索</button><button id="tabDraft">答弁原案を作る</button></div></header><main><section id="searchView" class="panel"><h2>一次資料を検索</h2><p class="lead">国会会議録の答弁と、質問主意書答弁書で実際に使われた定型表現を検索します。</p><div class="switch"><button data-type="all" class="active">すべて</button><button data-type="speech">国会答弁</button><button data-type="written">質問主意書答弁書</button></div><div class="row"><input id="q" placeholder="例：安全保障、物価高対策、お答えすることは困難"><button id="searchBtn">検索</button></div><div id="searchStatus" class="status">検索語を入力してください。</div><div id="results" class="results"></div></section><section id="draftView" class="hidden"><div class="draft-grid"><div class="panel"><h2>質問案を入力</h2><div class="notice">未公表情報、個人情報、秘密指定情報は入力しないでください。</div><div class="field"><label>作成する原案</label><select id="mode"><option value="speech">国会答弁</option><option value="written">質問主意書答弁書</option></select></div><div class="field"><label>質問案</label><textarea id="question" rows="16" placeholder="質問案を入力してください。箇条書きや一、二、三の形式にも対応します。"></textarea></div><button id="draftBtn" class="primary">答弁原案を作成</button></div><div class="panel"><div class="output-toolbar"><h2 id="draftTitle">答弁原案</h2><button id="copyBtn" class="ghost">コピー</button></div><div id="draftOutput" class="output">左側に質問案を入力してください。</div><div id="references" class="refs"></div></div></div></section></main><div class="footer-note">本サービスの出力は起案用の原案です。提出・答弁前に、主管府省において事実関係、法令、政府方針及び過去答弁との整合性を確認してください。</div><script>let type='all';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function show(view){const draft=view==='draft';$('#draftView').classList.toggle('hidden',!draft);$('#searchView').classList.toggle('hidden',draft);$('#tabDraft').classList.toggle('active',draft);$('#tabSearch').classList.toggle('active',!draft)}$('#tabSearch').onclick=()=>show('search');$('#tabDraft').onclick=()=>show('draft');$$('.switch button').forEach(b=>b.onclick=()=>{$$('.switch button').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type});$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')$('#searchBtn').click()});$('#searchBtn').onclick=async()=>{const q=$('#q').value.trim();if(!q)return;$('#searchStatus').textContent='検索中…';$('#searchStatus').classList.add('loading');$('#results').innerHTML='';try{const r=await fetch('/api/search?q='+encodeURIComponent(q)+'&type='+type);const d=await r.json();if(!r.ok)throw new Error(d.error);$('#searchStatus').textContent=`${d.results.length}件を表示。${d.coverage?.note||''}`;$('#results').innerHTML=d.results.map(x=>`<article class="card"><h4>${esc(x.title)}</h4><div class="meta">${esc(x.date)} ${esc(x.speaker)}｜${esc(x.sourceName)}</div><p>${esc(x.excerpt)}</p><a href="${esc(x.url)}" target="_blank" rel="noopener">公式原文を開く ↗</a></article>`).join('')||'<div class="status">該当資料がありません。</div>'}catch(e){$('#searchStatus').textContent=e.message}finally{$('#searchStatus').classList.remove('loading')}};function renderRefs(d){const refs=d.references||[];if(!refs.length){$('#references').innerHTML='';return}$('#references').innerHTML=`<h3>${esc(d.referenceLabel||'参考')}</h3>`+refs.map(x=>`<article class="card"><h4>${esc(x.title||'参考資料')}</h4><div class="meta">${esc(x.date||'')} ${esc(x.speaker||'')}｜${esc(x.sourceName||'')}</div>${x.quotedPhrase?`<div class="phrase">${esc(x.quotedPhrase)}</div>`:''}<div class="usage">使い方：${esc(x.usage||'答弁構成の確認')}</div><p><a href="${esc(x.url||'#')}" target="_blank" rel="noopener">公式原文を開く ↗</a></p></article>`).join('')}$('#draftBtn').onclick=async()=>{const question=$('#question').value.trim();if(question.length<8){alert('質問案を8文字以上で入力してください。');return}$('#draftBtn').disabled=true;$('#draftBtn').textContent='原案を作成中…';$('#draftOutput').textContent='過去答弁を検索し、原案を組み立てています…';$('#draftOutput').classList.add('loading');$('#references').innerHTML='';try{const r=await fetch('/api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:$('#mode').value,question})});const d=await r.json();if(!r.ok)throw new Error(d.error);$('#draftTitle').textContent=d.title;$('#draftOutput').textContent=d.draft;renderRefs(d)}catch(e){$('#draftOutput').textContent='原案の作成に失敗しました。もう一度お試しください。\n\n'+e.message}finally{$('#draftOutput').classList.remove('loading');$('#draftBtn').disabled=false;$('#draftBtn').textContent='答弁原案を作成'}};$('#copyBtn').onclick=async()=>{const text=$('#draftOutput').textContent;try{await navigator.clipboard.writeText(text);$('#copyBtn').textContent='コピーしました';setTimeout(()=>$('#copyBtn').textContent='コピー',1400)}catch{alert('コピーできませんでした。')}};</script></body></html>
