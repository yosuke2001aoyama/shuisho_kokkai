<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>国会答弁・質問主意書</title>
<style>
:root{--navy:#14233d;--red:#bd3443;--line:#d8dee7;--muted:#6c7685;--bg:#f3f5f8;--mark:#fff0a6;--borrow:#dcecff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 4vw;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-family:"Yu Mincho",serif;font-size:22px}.tabs,.respondent-tabs{display:flex;gap:6px}.tabs button,.respondent-tabs button{border:1px solid #b9c3d1;background:#fff;color:var(--navy);padding:9px 14px;font-weight:700;cursor:pointer}.tabs button.on,.respondent-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}main{max-width:1280px;margin:22px auto 50px;padding:0 20px}.panel{background:#fff;border:1px solid var(--line);padding:24px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:minmax(330px,.8fr) minmax(0,1.2fr);gap:18px}.field{display:grid;gap:7px;margin-bottom:14px}label{font-weight:700}input,textarea,select{width:100%;border:1px solid #c7d0dd;padding:13px;font:inherit;background:#fff}.primary,.row button{border:0;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.primary{width:100%;min-height:50px}.output{font-family:"Yu Mincho",serif;line-height:2.05;font-size:17px;min-height:260px}.segment{white-space:pre-wrap}.source-link{background:var(--mark);border-bottom:1px dotted #8a6c00;color:inherit;text-decoration:none;padding:1px 2px}.source-link.borrowed{background:repeating-linear-gradient(135deg,var(--borrow),var(--borrow) 8px,#eef6ff 8px,#eef6ff 16px)}.draft-note{margin-top:24px;border-top:1px solid var(--line);padding-top:9px;font-size:10px;line-height:1.55;color:#77808d}.refs{border-top:2px solid var(--line);margin-top:26px;padding-top:18px}.refs h3{font-family:"Yu Mincho",serif;margin:0 0 12px}.card{border:1px solid var(--line);padding:15px;margin:10px 0;background:#fff;scroll-margin-top:16px}.card.flash{outline:3px solid #efc84a}.card h4{margin:0 0 7px;font-family:"Yu Mincho",serif}.meta,.badge,.source-type{font-size:12px;color:var(--muted)}.badge,.source-type{display:inline-block;border:1px solid var(--line);padding:3px 7px;margin:0 6px 8px 0;background:#f8fafc}.badge.borrowed{background:#eef6ff}.phrase{font-family:"Yu Mincho",serif;background:#f8fafc;border-left:3px solid var(--navy);padding:10px 12px;margin:9px 0;line-height:1.7}.card a{font-size:12px;color:#1d4f91;font-weight:700}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.row button{padding:0 22px}.results{display:grid;gap:10px;margin-top:14px}.status{margin-top:12px;font-size:12px;color:var(--muted)}.error{border:1px solid #e3b9bd;background:#fff5f6;padding:12px;color:#8b2631;font-size:13px}.evidence-summary{font-size:12px;color:#506074;margin-bottom:12px}@media(max-width:850px){.top{align-items:flex-start;gap:12px;flex-direction:column}.grid,.row{grid-template-columns:1fr}.tabs,.respondent-tabs{width:100%}.tabs button,.respondent-tabs button{flex:1}.output{font-size:16px}}
</style>
</head>
<body>
<header class="top"><h1>国会答弁・質問主意書</h1><div class="tabs"><button id="tabSearch" class="on">資料検索</button><button id="tabDraft">原案作成</button></div></header>
<main>
<section id="searchView" class="panel"><div class="row"><input id="q" placeholder="検索語"><button id="searchBtn">検索</button></div><div id="searchStatus" class="status"></div><div id="results" class="results"></div></section>
<section id="draftView" class="hidden"><div class="grid"><div class="panel"><div class="field"><label>形式</label><select id="mode"><option value="speech">国会答弁</option><option value="written">質問主意書答弁書</option></select></div><div class="field" id="respondentField"><label>答弁者</label><div class="respondent-tabs"><button type="button" data-value="prime">総理</button><button type="button" data-value="minister" class="on">大臣</button><button type="button" data-value="official">政府参考人</button></div></div><div class="field"><label>質問</label><textarea id="question" rows="18"></textarea></div><button id="draftBtn" class="primary">根拠付き答弁原案を作成</button></div><div class="panel"><h2 id="draftTitle">原案</h2><div id="draftOutput" class="output"></div><div id="references" class="refs hidden"></div><aside id="disclaimer" class="draft-note hidden"></aside></div></div></section>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let respondent='minister';
const categoryLabels={prime:'総理',minister:'大臣',official:'政府参考人',cabinet:'閣議決定済み答弁書',official_policy:'政府公式資料'};
const sourceLabels={answer:'国会答弁',written:'質問主意書答弁書',press:'会見・演説',interview:'インタビュー・寄稿',fact:'政府公式資料'};
function syncMode(){const written=$('#mode').value==='written';$('#respondentField').classList.toggle('hidden',written);$('#draftBtn').textContent=written?'根拠付き答弁書原案を作成':'根拠付き答弁原案を作成'}
function show(draft){$('#draftView').classList.toggle('hidden',!draft);$('#searchView').classList.toggle('hidden',draft);$('#tabDraft').classList.toggle('on',draft);$('#tabSearch').classList.toggle('on',!draft)}
$('#tabSearch').onclick=()=>show(false);$('#tabDraft').onclick=()=>{show(true);syncMode()};$('#mode').onchange=syncMode;
document.querySelectorAll('.respondent-tabs button').forEach(b=>b.onclick=()=>{respondent=b.dataset.value;document.querySelectorAll('.respondent-tabs button').forEach(x=>x.classList.toggle('on',x===b))});
function card(x,id=''){return `<article class="card" ${id?`id="${id}"`:''}><span class="source-type">${esc(x.sourceTypeLabel||sourceLabels[x.sourceType]||x.sourceType||'資料')}</span>${x.categoryLabel||x.category?`<span class="badge ${x.borrowed?'borrowed':''}">${esc(x.categoryLabel||categoryLabels[x.category]||x.category)}${x.borrowed?'（別カテゴリー）':''}</span>`:''}<h4>${esc(x.title||'参考資料')}</h4><div class="meta">${esc(x.date||'')} ${esc(x.speaker||'')} ${esc(x.speakerPosition||'')}｜${esc(x.sourceName||'')}</div>${x.quotedPhrase||x.phrase?`<div class="phrase">${esc(x.quotedPhrase||x.phrase)}</div>`:''}<p><a href="${esc(x.url||'#')}" target="_blank" rel="noopener">公式原文を開く ↗</a></p></article>`}
function renderDraft(d){const refs=d.references||[];$('#draftTitle').textContent=d.title||'原案';$('#draftOutput').innerHTML=(d.segments||[]).map(s=>{const body=esc(s.text);return s.referenceKey?`<a class="segment source-link ${s.borrowed?'borrowed':''}" href="#ref-${s.referenceKey}" data-ref="${s.referenceKey}">${body}</a>`:`<span class="segment">${body}</span>`}).join('');$('#references').classList.toggle('hidden',!refs.length);$('#references').innerHTML=refs.length?`<h3>${esc(d.referenceLabel||'根拠')}</h3><div class="evidence-summary">使用した一次資料 ${refs.length}件</div>`+refs.map(x=>card(x,'ref-'+x.referenceKey)).join(''):'';$('#disclaimer').textContent=d.disclaimer||'';$('#disclaimer').classList.toggle('hidden',!d.disclaimer);document.querySelectorAll('.source-link').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById('ref-'+a.dataset.ref);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1500)}})}
$('#draftBtn').onclick=async()=>{const question=$('#question').value.trim();if(question.length<8)return alert('質問を8文字以上で入力してください。');$('#draftBtn').disabled=true;$('#draftOutput').textContent='論点分析・一次資料横断検索・常体起案中…';$('#references').classList.add('hidden');try{const r=await fetch('/api/draft',{method:'POST',headers:{'content-type':'application/json'},cache:'no-store',body:JSON.stringify({mode:$('#mode').value,respondent,question})}),d=await r.json();if(!r.ok)throw new Error(d.error);renderDraft(d)}catch(e){$('#draftOutput').innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{$('#draftBtn').disabled=false;syncMode()}};
$('#searchBtn').onclick=async()=>{const q=$('#q').value.trim();if(!q)return;$('#searchStatus').textContent='国会答弁・答弁書・会見・インタビュー・公式資料を検索中…';try{const r=await fetch('/api/search?q='+encodeURIComponent(q)+'&respondent='+encodeURIComponent(respondent),{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error);$('#searchStatus').textContent=`${d.results.length}件。${d.coverage?.note||''}`;$('#results').innerHTML=(d.results||[]).map(x=>card(x)).join('')}catch(e){$('#searchStatus').textContent=e.message}};
syncMode();
</script>
</body>
</html>
