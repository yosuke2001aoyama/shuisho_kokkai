<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国会答弁・質問主意書アーカイブ</title><style>:root{--navy:#14233d;--red:#b93643;--line:#d8dee7;--muted:#687386;--paper:#fff;--bg:#f3f5f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.top{background:var(--navy);color:#fff;padding:20px 7vw}.top h1{margin:0;font-family:"Yu Mincho",serif;font-size:25px}.top p{margin:7px 0 0;color:#cbd5e1;font-size:12px}.hero{padding:45px 7vw 70px;background:linear-gradient(135deg,#172b4d,#0f1d34);color:#fff}.hero h2{font-family:"Yu Mincho",serif;font-size:38px;line-height:1.45;margin:0;max-width:800px}.hero p{max-width:760px;color:#dbe3ef;line-height:1.8}.tabs{display:flex;gap:8px;margin-top:24px}.tabs button{border:1px solid #ffffff55;background:#ffffff10;color:#fff;padding:12px 18px;font-weight:700}.tabs button.active{background:#fff;color:var(--navy)}main{max-width:1180px;margin:-35px auto 70px;padding:0 22px}.panel{background:#fff;border:1px solid var(--line);box-shadow:0 18px 45px #12213d14;padding:28px;margin-bottom:22px}.panel h3{margin:0 0 18px;font-family:"Yu Mincho",serif}.row{display:grid;grid-template-columns:1fr auto;gap:10px}.row input,textarea,select{width:100%;border:1px solid #cbd5e1;padding:14px;font:inherit;background:#fff}.row button,.primary{border:0;background:var(--red);color:#fff;padding:0 24px;font-weight:800}.switch{display:flex;gap:8px;margin-bottom:14px}.switch button{border:1px solid var(--line);background:#f8fafc;padding:9px 14px}.switch button.active{background:var(--navy);color:#fff}.status{margin-top:17px;padding:12px 14px;background:#f8f6ef;border-left:3px solid #b69a55;color:#645f52;font-size:13px}.results{display:grid;gap:12px;margin-top:18px}.card{border:1px solid var(--line);padding:18px}.card h4{margin:0 0 6px;font-family:"Yu Mincho",serif}.meta{color:var(--muted);font-size:11px;margin-bottom:8px}.card p{color:#4b5563;line-height:1.75;font-size:13px}.card a{color:#1d4f91;font-weight:700;font-size:12px}.draft-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:20px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:12px;font-weight:800}.primary{min-height:48px;width:100%}.output{white-space:pre-wrap;font-family:"Yu Mincho",serif;line-height:2;min-height:300px}.refs{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}.hidden{display:none}.notice{background:#fff7f1;border-left:3px solid #c66b3a;padding:12px;font-size:12px;color:#6e5244;margin-bottom:15px}@media(max-width:800px){.draft-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.row button{min-height:48px}.hero h2{font-size:30px}}</style></head><body><header class="top"><h1>国会答弁・質問主意書アーカイブ</h1><p>公開一次資料の横断検索・根拠付き起案支援</p></header><section class="hero"><h2>過去の政府答弁を探し、根拠とともに起案する。</h2><p>国民向けには公開情報の検索基盤、実務者向けには国会答弁・質問主意書答弁書の起案ワークスペースを提供します。</p><div class="tabs"><button id="tabSearch" class="active">公開検索</button><button id="tabDraft">起案ワークスペース</button></div></section><main><section id="searchView" class="panel"><h3>一次資料を検索</h3><div class="switch"><button data-type="all" class="active">すべて</button><button data-type="speech">国会答弁</button><button data-type="written">質問主意書</button></div><div class="row"><input id="q" placeholder="例：安全保障、物価高対策、在留邦人保護"><button id="searchBtn">検索</button></div><div id="searchStatus" class="status">検索語を入力してください。</div><div id="results" class="results"></div></section><section id="draftView" class="hidden"><div class="draft-grid"><div class="panel"><h3>質問案を入力</h3><div class="notice">未公表情報、個人情報、秘密指定情報は入力しないでください。生成物は正式な政府見解ではありません。</div><div class="field"><label>形式</label><select id="mode"><option value="speech">国会答弁</option><option value="written">質問主意書答弁書</option></select></div><div class="field"><label>架空の質問案</label><textarea id="question" rows="14" placeholder="質問案を入力してください"></textarea></div><button id="draftBtn" class="primary">根拠付き起案骨子を作成</button></div><div class="panel"><h3 id="draftTitle">起案結果</h3><div id="draftOutput" class="output">左側に質問案を入力してください。</div><div id="references" class="refs"></div></div></div></section></main><script>let type='all';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('#tabSearch').onclick=()=>{$('#searchView').classList.remove('hidden');$('#draftView').classList.add('hidden');$('#tabSearch').classList.add('active');$('#tabDraft').classList.remove('active')};$('#tabDraft').onclick=()=>{$('#draftView').classList.remove('hidden');$('#searchView').classList.add('hidden');$('#tabDraft').classList.add('active');$('#tabSearch').classList.remove('active')};$$('.switch button').forEach(b=>b.onclick=()=>{$$('.switch button').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type});$('#searchBtn').onclick=async()=>{const q=$('#q').value.trim();if(!q)return;$('#searchStatus').textContent='検索中…';$('#results').innerHTML='';try{const r=await fetch('/api/search?q='+encodeURIComponent(q)+'&type='+type);const d=await r.json();if(!r.ok)throw new Error(d.error);$('#searchStatus').textContent=`${d.results.length}件を表示。${d.coverage?.note||''}`;$('#results').innerHTML=d.results.map(x=>`<article class="card"><h4>${esc(x.title)}</h4><div class="meta">${esc(x.date)} ${esc(x.speaker)}｜${esc(x.sourceName)}</div><p>${esc(x.excerpt)}</p><a href="${esc(x.url)}" target="_blank" rel="noopener">公式原文を開く ↗</a></article>`).join('')||'<div class="status">該当資料がありません。</div>'}catch(e){$('#searchStatus').textContent=e.message}};$('#draftBtn').onclick=async()=>{const question=$('#question').value.trim();if(question.length<8){alert('質問案を8文字以上で入力してください。');return}$('#draftBtn').disabled=true;$('#draftBtn').textContent='作成中…';$('#draftOutput').textContent='一次資料を検索しています…';$('#references').innerHTML='';try{const r=await fetch('/api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:$('#mode').value,question})});const d=await r.json();if(!r.ok)throw new Error(d.error);$('#draftTitle').textContent=d.title;$('#draftOutput').textContent=d.draft+'\n\n'+d.disclaimer;$('#references').innerHTML=`<h3>${esc(d.referenceLabel||'参考')}</h3>`+(d.sources||[]).slice(0,8).map(x=>`<article class="card"><h4>${esc(x.title)}</h4><div class="meta">${esc(x.date)} ${esc(x.speaker)}</div><p>${esc(x.excerpt)}</p><a href="${esc(x.url)}" target="_blank" rel="noopener">公式原文を開く ↗</a></article>`).join('')}catch(e){$('#draftOutput').textContent=e.message}finally{$('#draftBtn').disabled=false;$('#draftBtn').textContent='根拠付き起案骨子を作成'}};</script></body></html>
